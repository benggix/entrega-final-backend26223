# Conexión a PostgreSQL. Cada valor se puede sobreescribir con una variable de entorno
# (docker-compose las define). Si no existen, usa los valores por defecto de la derecha.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/articulos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Crea/actualiza las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# (No hace falta indicar el dialecto: Hibernate lo detecta solo para PostgreSQL)
