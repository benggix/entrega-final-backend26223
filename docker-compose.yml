services:
  db:
    image: postgres:16-alpine
    container_name: articulos_db
    environment:
      POSTGRES_DB: articulos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"            # para conectarte con psql/DBeaver/pgAdmin desde tu PC
    volumes:
      - pgdata:/var/lib/postgresql/data   # los datos sobreviven a reinicios
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articulos_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: articulos_api
    depends_on:
      db:
        condition: service_healthy   # espera a que Postgres esté listo
    environment:
      DB_URL: jdbc:postgresql://db:5432/articulos_db   # "db" = nombre del servicio
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  pgdata:
